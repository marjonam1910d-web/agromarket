# VPS (Ubuntu) dagi tashqi Nginx: HTTPS (Let's Encrypt) → docker "web" konteyneri (127.0.0.1:8080)
# sudo cp docker/nginx/host-site.conf /etc/nginx/sites-available/agromarket && sudo ln -s ../sites-available/agromarket /etc/nginx/sites-enabled/
# sudo certbot --nginx -d agromarket.uz -d www.agromarket.uz
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# Login/OTP uchun qo'shimcha cheklov (backend rate limit'dan tashqari)
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
  listen 80;
  server_name agromarket.uz www.agromarket.uz;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name agromarket.uz www.agromarket.uz;

  ssl_certificate     /etc/letsencrypt/live/agromarket.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/agromarket.uz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 12m;

  location /api/v1/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
